<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="auth-body">

<div class="auth-page">

    <!-- Left Panel: Branding -->
    <div class="auth-left">
        <div class="auth-left-content">
            <div class="auth-logo-block">
                <div class="auth-logo-icon">⚡</div>
                <div class="auth-logo-text">SSC<span>CGL</span></div>
                <div class="auth-logo-sub">EXAMINATION PORTAL</div>
            </div>
            <div class="auth-left-tagline">
                Practice Smarter.<br>Score Better.
            </div>
            <div class="auth-stats-row">
                <div class="auth-stat-item">
                    <div class="auth-stat-val">100</div>
                    <div class="auth-stat-lbl">Questions</div>
                </div>
                <div class="auth-stat-div"></div>
                <div class="auth-stat-item">
                    <div class="auth-stat-val">200</div>
                    <div class="auth-stat-lbl">Max Marks</div>
                </div>
                <div class="auth-stat-div"></div>
                <div class="auth-stat-item">
                    <div class="auth-stat-val">60</div>
                    <div class="auth-stat-lbl">Minutes</div>
                </div>
                <div class="auth-stat-div"></div>
                <div class="auth-stat-item">
                    <div class="auth-stat-val">4</div>
                    <div class="auth-stat-lbl">Sections</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel: Login Form -->
    <div class="auth-right">
        <div class="auth-form-box">
            <div class="auth-form-header">
                <h2 class="auth-form-title">Candidate Login</h2>
                <p class="auth-form-sub">Sign in to access your exam dashboard</p>
            </div>

            <div th:if="${loginError}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${loginError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${logoutMsg}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${logoutMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${expiredMsg}" class="alert alert-warning alert-dismissible fade show">
                <i class="bi bi-exclamation-circle-fill me-2"></i>
                <span th:text="${expiredMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMsg}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/login}" method="post" class="auth-form" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="auth-field">
                    <label class="auth-label">Username</label>
                    <div class="auth-input-wrap">
                        <i class="bi bi-person-fill auth-input-icon"></i>
                        <input type="text" class="auth-input" name="username"
                               placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>

                <div class="auth-field">
                    <label class="auth-label">Password</label>
                    <div class="auth-input-wrap">
                        <i class="bi bi-lock-fill auth-input-icon"></i>
                        <input type="password" class="auth-input" id="password" name="password"
                               placeholder="Enter your password" required autocomplete="current-password">
                        <button class="auth-eye-btn" type="button" id="togglePassword">
                            <i class="bi bi-eye-fill" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-submit-btn">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login to Portal
                </button>
            </form>

            <div class="auth-form-footer">
                Don't have an account? <a th:href="@{/register}" class="auth-link">Register here</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('togglePassword').addEventListener('click', function() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.className = 'bi bi-eye-slash-fill';
        } else {
            pwd.type = 'password';
            icon.className = 'bi bi-eye-fill';
        }
    });
</script>
</body>
</html>
