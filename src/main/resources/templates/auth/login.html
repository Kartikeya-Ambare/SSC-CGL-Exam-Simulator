<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="auth-body">

<div class="auth-container">
    <div class="auth-brand">
        <div class="auth-logo">⚡</div>
        <h1 class="auth-title">SSC<span>CGL</span></h1>
        <p class="auth-subtitle">EXAMINATION PORTAL</p>
    </div>

    <div class="auth-card">
        <div class="auth-card-header">
            <h2>Candidate Login</h2>
            <p>Sign in to access your exam dashboard</p>
        </div>

        <div th:if="${loginError}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${loginError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${logoutMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${logoutMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${expiredMsg}" class="alert alert-warning alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2"></i>
            <span th:text="${expiredMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/login}" method="post" class="auth-form" id="loginForm" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group mb-4">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Enter your username" required autocomplete="username">
                </div>
            </div>

            <div class="form-group mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Enter your password" required autocomplete="current-password">
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="bi bi-eye-fill" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-auth w-100">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login to Portal
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a th:href="@{/register}" class="auth-link">Register here</a></p>
        </div>
    </div>

    <div class="auth-info-strip">
        <div class="info-item"><span class="info-num">100</span><span class="info-label">Questions</span></div>
        <div class="info-divider"></div>
        <div class="info-item"><span class="info-num">200</span><span class="info-label">Marks</span></div>
        <div class="info-divider"></div>
        <div class="info-item"><span class="info-num">60</span><span class="info-label">Minutes</span></div>
        <div class="info-divider"></div>
        <div class="info-item"><span class="info-num">4</span><span class="info-label">Sections</span></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('togglePassword').addEventListener('click', function() {
        const pwd = document.getElementById('password');
        const icon = document.getElementById('toggleIcon');
        if (pwd.type === 'password') {
            pwd.type = 'text';
            icon.className = 'bi bi-eye-slash-fill';
        } else {
            pwd.type = 'password';
            icon.className = 'bi bi-eye-fill';
        }
    });
</script>
</body>
</html>
