<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-body">

<div class="auth-page register-page">

    <!-- Left Panel -->
    <div class="auth-left">
        <div class="auth-left-content">
            <div class="auth-logo-block">
                <div class="auth-logo-icon">⚡</div>
                <div class="auth-logo-text">SSC<span>CGL</span></div>
                <div class="auth-logo-sub">EXAMINATION PORTAL</div>
            </div>
            <div class="auth-left-tagline">
                Join Thousands<br>of Aspirants.
            </div>
            <div class="auth-steps">
                <div class="auth-step">
                    <div class="auth-step-num">01</div>
                    <div class="auth-step-text">Create your free account</div>
                </div>
                <div class="auth-step">
                    <div class="auth-step-num">02</div>
                    <div class="auth-step-text">Attempt unlimited mock tests</div>
                </div>
                <div class="auth-step">
                    <div class="auth-step-num">03</div>
                    <div class="auth-step-text">Track progress &amp; improve</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Panel: Register Form -->
    <div class="auth-right auth-right-wide">
        <div class="auth-form-box auth-form-box-lg">
            <div class="auth-form-header">
                <h2 class="auth-form-title">Candidate Registration</h2>
                <p class="auth-form-sub">Create your account to start practicing for SSC CGL</p>
            </div>

            <div th:if="${registrationError}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${registrationError}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/register}" method="post" th:object="${registrationDto}"
                  class="auth-form" id="registerForm" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="auth-field">
                            <label class="auth-label">Full Name *</label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-person-badge-fill auth-input-icon"></i>
                                <input type="text" class="auth-input" th:field="*{fullName}"
                                       placeholder="Your full name" required>
                            </div>
                            <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="auth-field">
                            <label class="auth-label">Username *</label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-at auth-input-icon"></i>
                                <input type="text" class="auth-input" th:field="*{username}"
                                       placeholder="Choose a username" required>
                            </div>
                            <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="auth-field">
                            <label class="auth-label">Email Address *</label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-envelope-fill auth-input-icon"></i>
                                <input type="email" class="auth-input" th:field="*{email}"
                                       placeholder="your@email.com" required>
                            </div>
                            <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="auth-field">
                            <label class="auth-label">Mobile Number</label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-phone-fill auth-input-icon"></i>
                                <input type="tel" class="auth-input" th:field="*{mobile}"
                                       placeholder="10-digit mobile number" maxlength="10">
                            </div>
                            <div class="field-error" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="auth-field">
                            <label class="auth-label">Password *</label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-lock-fill auth-input-icon"></i>
                                <input type="password" class="auth-input" id="password" th:field="*{password}"
                                       placeholder="Min 8 characters" required>
                                <button class="auth-eye-btn" type="button" id="togglePwd1">
                                    <i class="bi bi-eye-fill"></i>
                                </button>
                            </div>
                            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="auth-field">
                            <label class="auth-label">Confirm Password *</label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-lock-fill auth-input-icon"></i>
                                <input type="password" class="auth-input" id="confirmPassword" th:field="*{confirmPassword}"
                                       placeholder="Repeat password" required>
                                <button class="auth-eye-btn" type="button" id="togglePwd2">
                                    <i class="bi bi-eye-fill"></i>
                                </button>
                            </div>
                            <div class="field-error" th:if="${passwordError}" th:text="${passwordError}"></div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="auth-field">
                            <label class="auth-label">Date of Birth</label>
                            <input type="date" class="auth-input" th:field="*{dateOfBirth}" max="2007-12-31">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="auth-field">
                            <label class="auth-label">Gender</label>
                            <select class="auth-input" th:field="*{gender}">
                                <option value="">Select Gender</option>
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="auth-field">
                            <label class="auth-label">State</label>
                            <select class="auth-input" th:field="*{state}">
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                                <option value="Assam">Assam</option>
                                <option value="Bihar">Bihar</option>
                                <option value="Chhattisgarh">Chhattisgarh</option>
                                <option value="Goa">Goa</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="Haryana">Haryana</option>
                                <option value="Himachal Pradesh">Himachal Pradesh</option>
                                <option value="Jharkhand">Jharkhand</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Kerala">Kerala</option>
                                <option value="Madhya Pradesh">Madhya Pradesh</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Manipur">Manipur</option>
                                <option value="Meghalaya">Meghalaya</option>
                                <option value="Mizoram">Mizoram</option>
                                <option value="Nagaland">Nagaland</option>
                                <option value="Odisha">Odisha</option>
                                <option value="Punjab">Punjab</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="Sikkim">Sikkim</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Telangana">Telangana</option>
                                <option value="Tripura">Tripura</option>
                                <option value="Uttar Pradesh">Uttar Pradesh</option>
                                <option value="Uttarakhand">Uttarakhand</option>
                                <option value="West Bengal">West Bengal</option>
                                <option value="Delhi">Delhi</option>
                                <option value="Jammu and Kashmir">Jammu and Kashmir</option>
                                <option value="Ladakh">Ladakh</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="auth-submit-btn">
                        <i class="bi bi-person-plus-fill me-2"></i>Create Account
                    </button>
                </div>
            </form>

            <div class="auth-form-footer">
                Already have an account? <a th:href="@{/login}" class="auth-link">Login here</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePass(btnId, inputId) {
        document.getElementById(btnId).addEventListener('click', function() {
            const inp = document.getElementById(inputId);
            const icon = this.querySelector('i');
            inp.type = inp.type === 'password' ? 'text' : 'password';
            icon.className = inp.type === 'password' ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill';
        });
    }
    togglePass('togglePwd1', 'password');
    togglePass('togglePwd2', 'confirmPassword');
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('confirmPassword').value;
        if (p1 !== p2) {
            e.preventDefault();
            document.getElementById('confirmPassword').setCustomValidity('Passwords do not match');
            document.getElementById('confirmPassword').reportValidity();
        }
    });
</script>
</body>
</html>
