<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-body">

<div class="auth-container register-container">
    <div class="auth-brand">
        <div class="auth-logo">⚡</div>
        <h1 class="auth-title">SSC<span>CGL</span></h1>
        <p class="auth-subtitle">EXAMINATION PORTAL</p>
    </div>

    <div class="auth-card auth-card-lg">
        <div class="auth-card-header">
            <h2>Candidate Registration</h2>
            <p>Create your account to start practicing</p>
        </div>

        <div th:if="${registrationError}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${registrationError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <form th:action="@{/register}" method="post" th:object="${registrationDto}"
              class="auth-form" id="registerForm" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                        <input type="text" class="form-control" th:field="*{fullName}"
                               placeholder="Your full name" required>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Username *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-at"></i></span>
                        <input type="text" class="form-control" th:field="*{username}"
                               placeholder="Choose username" required>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    <small class="form-text text-muted">Letters, numbers and underscores only</small>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Email Address *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                        <input type="email" class="form-control" th:field="*{email}"
                               placeholder="your@email.com" required>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Mobile Number</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-phone-fill"></i></span>
                        <input type="tel" class="form-control" th:field="*{mobile}"
                               placeholder="10-digit mobile number" maxlength="10">
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('mobile')}" th:errors="*{mobile}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Password *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="password" th:field="*{password}"
                               placeholder="Min 8 characters" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePwd1">
                            <i class="bi bi-eye-fill"></i>
                        </button>
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Confirm Password *</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                               placeholder="Repeat password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePwd2">
                            <i class="bi bi-eye-fill"></i>
                        </button>
                    </div>
                    <div class="field-error" th:if="${passwordError}" th:text="${passwordError}"></div>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control" th:field="*{dateOfBirth}" max="2007-12-31">
                </div>

                <div class="col-md-4">
                    <label class="form-label">Gender</label>
                    <select class="form-select" th:field="*{gender}">
                        <option value="">Select Gender</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">State</label>
                    <select class="form-select" th:field="*{state}">
                        <option value="">Select State</option>
                        <option>Andhra Pradesh</option><option>Arunachal Pradesh</option>
                        <option>Assam</option><option>Bihar</option><option>Chhattisgarh</option>
                        <option>Goa</option><option>Gujarat</option><option>Haryana</option>
                        <option>Himachal Pradesh</option><option>Jharkhand</option>
                        <option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option>
                        <option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option>
                        <option>Mizoram</option><option>Nagaland</option><option>Odisha</option>
                        <option>Punjab</option><option>Rajasthan</option><option>Sikkim</option>
                        <option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option>
                        <option>Uttar Pradesh</option><option>Uttarakhand</option>
                        <option>West Bengal</option><option>Delhi</option>
                        <option>Jammu and Kashmir</option><option>Ladakh</option>
                    </select>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary btn-auth w-100">
                    <i class="bi bi-person-plus-fill me-2"></i>Create Account
                </button>
            </div>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a th:href="@{/login}" class="auth-link">Login here</a></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePass(btnId, inputId) {
        document.getElementById(btnId).addEventListener('click', function() {
            const inp = document.getElementById(inputId);
            const icon = this.querySelector('i');
            inp.type = inp.type === 'password' ? 'text' : 'password';
            icon.className = inp.type === 'password' ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill';
        });
    }
    togglePass('togglePwd1', 'password');
    togglePass('togglePwd2', 'confirmPassword');

    // Client-side password match validation
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('confirmPassword').value;
        if (p1 !== p2) {
            e.preventDefault();
            document.getElementById('confirmPassword').setCustomValidity('Passwords do not match');
            document.getElementById('confirmPassword').reportValidity();
        }
    });
</script>
</body>
</html>
