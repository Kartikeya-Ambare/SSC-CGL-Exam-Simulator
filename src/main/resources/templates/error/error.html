<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — SSC CGL Exam Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<div class="error-wrapper">
    <div>
        <div class="error-code" th:text="${status != null ? status : '500'}">500</div>
        <h3 class="mb-2" style="font-family:'Rajdhani',sans-serif;font-weight:700;color:#1a3c6e;">
            <span th:if="${status == 403}">Access Denied</span>
            <span th:if="${status == 404}">Page Not Found</span>
            <span th:if="${status == 500 or status == null}">Internal Server Error</span>
            <span th:if="${status != 403 and status != 404 and status != 500 and status != null}" th:text="${error}">Error</span>
        </h3>
        <p class="text-muted mb-4" style="max-width:440px;margin:0 auto;">
            <span th:if="${status == 403}">You don't have permission to access this page.</span>
            <span th:if="${status == 404}">The page you're looking for doesn't exist or has been moved.</span>
            <span th:if="${status == 500 or status == null}">Something went wrong on our end. Please try again.</span>
            <span th:if="${message != null and status != 403 and status != 404 and status != 500}" th:text="${message}"></span>
        </p>
        <div class="d-flex gap-3 justify-content-center flex-wrap">
            <a href="/dashboard" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Go to Dashboard
            </a>
            <button onclick="history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Go Back
            </button>
        </div>
        <div class="mt-4 text-muted" style="font-size:0.78rem;">
            SSC CGL Exam Portal &nbsp;·&nbsp;
            <a href="/login" class="text-muted">Login</a>
        </div>
    </div>
</div>

</body>
</html>
