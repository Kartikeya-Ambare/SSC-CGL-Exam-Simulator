<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSC CGL | Review Answers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/exam.css}" rel="stylesheet">
</head>
<body class="exam-body">

<div class="exam-header">
    <div class="exam-header-left">
        <div class="exam-logo">⚡ SSC CGL</div>
        <div class="exam-title">Review &amp; Submit</div>
    </div>
    <div class="exam-header-center">
        <div class="timer-display" id="timerDisplay">
            <span class="timer-label">Time Remaining</span>
            <span class="timer-value" id="timerValue">--:--</span>
        </div>
    </div>
    <div class="exam-header-right">
        <div class="candidate-info">
            <span class="candidate-name" th:text="${user.fullName}">Candidate</span>
        </div>
    </div>
</div>

<div class="container py-4" style="max-width:1000px;">
    <div class="review-header mb-4">
        <h4><i class="bi bi-list-check me-2"></i>Answer Summary</h4>
        <p class="text-muted">Review your answers before final submission.</p>
    </div>

    <!-- Summary Stats -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="review-stat review-stat-answered">
                <span class="review-stat-num" th:text="${examState.totalAnswered}">0</span>
                <span class="review-stat-label">Answered</span>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="review-stat review-stat-notanswered">
                <span class="review-stat-num" th:text="${examState.totalNotAnswered}">0</span>
                <span class="review-stat-label">Not Answered</span>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="review-stat review-stat-notvisited">
                <span class="review-stat-num" th:text="${examState.totalNotVisited}">0</span>
                <span class="review-stat-label">Not Visited</span>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="review-stat review-stat-marked">
                <span class="review-stat-num" th:text="${examState.totalMarkedForReview + examState.totalAnsweredMarked}">0</span>
                <span class="review-stat-label">Marked</span>
            </div>
        </div>
    </div>

    <!-- Section-wise review palette -->
    <th:block th:each="entry : ${examState.sectionProgress}">
    <div class="section-review-block mb-4">
        <div class="section-review-header">
            <h6 th:text="${entry.value.displayName}">Section</h6>
            <span class="section-review-score">
                <span class="text-success" th:text="${entry.value.answered + entry.value.answeredMarked}">0</span>
                / <span th:text="${entry.value.total}">25</span> answered
            </span>
        </div>
        <div class="review-palette">
            <th:block th:each="q : ${examState.questions}">
                <th:block th:if="${q.section == entry.key}">
                    <a th:attr="href='/exam/' + ${sessionId} + '/attempt#q' + ${q.position}"
                       th:data-pos="${q.position}"
                       th:classappend="${examState.answers[q.position] != null ? (examState.answers[q.position].status == 'ANSWERED' ? 'q-answered' : (examState.answers[q.position].status == 'ANSWERED_MARKED' ? 'q-answered-marked' : (examState.answers[q.position].status == 'MARKED_FOR_REVIEW' ? 'q-marked' : (examState.answers[q.position].status == 'NOT_ANSWERED' ? 'q-not-answered' : 'q-not-visited')))) : 'q-not-visited'}"
                       class="review-q-btn"
                       th:text="${q.position + 1}">1</a>
                </th:block>
            </th:block>
        </div>
    </div>
    </th:block>

    <div class="review-actions mt-4">
        <a th:href="@{/exam/{id}/attempt(id=${sessionId})}" class="btn btn-outline-primary btn-lg">
            <i class="bi bi-arrow-left me-2"></i>Back to Exam
        </a>
        <form th:action="@{/exam/{id}/submit(id=${sessionId})}" method="post" class="d-inline ms-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-danger btn-lg"
                    onclick="return confirm('Are you sure you want to submit the exam? This action cannot be undone.')">
                <i class="bi bi-send-fill me-2"></i>SUBMIT EXAM
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Timer sync
    const SESSION_ID = /*[[${sessionId}]]*/null;
    let timerInterval;
    async function syncTimer() {
        try {
            const resp = await fetch('/api/exam/' + SESSION_ID + '/time');
            const data = await resp.json();
            if (data.timeRemaining !== undefined) {
                updateTimerDisplay(data.timeRemaining);
                if (data.timeUp) {
                    clearInterval(timerInterval);
                    window.location.href = '/exam/' + SESSION_ID + '/result';
                }
            }
        } catch(e) {}
    }
    function updateTimerDisplay(secs) {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        document.getElementById('timerValue').textContent =
            String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        const el = document.getElementById('timerDisplay');
        if (secs < 300) el.classList.add('timer-critical');
        else if (secs < 600) el.classList.add('timer-warning');
    }
    syncTimer();
    timerInterval = setInterval(() => {
        const val = document.getElementById('timerValue').textContent;
        const parts = val.split(':');
        let total = parseInt(parts[0]) * 60 + parseInt(parts[1]);
        if (total > 0) {
            total--;
            updateTimerDisplay(total);
        } else {
            clearInterval(timerInterval);
            fetch('/api/exam/' + SESSION_ID + '/auto-submit', {method:'POST', headers:{'X-CSRF-TOKEN': '[[${_csrf.token}]]'}});
            setTimeout(() => window.location.href = '/exam/' + SESSION_ID + '/result', 2000);
        }
    }, 1000);
</script>
</body>
</html>
